site_name: WinDev
site_description: Portable Windows Development Environment

use_directory_urls: false

theme:
  name: readthedocs
  navigation_depth: 4
  collapse_navigation: false
  sticky_navigation: true
  include_homepage_in_sidebar: true
  prev_next_buttons_location: bottom
  highlightjs: true

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - toc:
      permalink: true

